<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar glass">
    <a href="index.html" class="logo"><span class="icon">📚</span><span class="gradient-text">StudyOS</span></a>
    <div class="nav-desktop nav-links">
      <a href="index.html" data-i18n="studyos.navHome">Home</a><a href="dashboard.html" data-i18n="studyos.navDashboard">Dashboard</a><a href="planner.html" data-i18n="studyos.navPlanner">Planner</a>
      <a href="focus.html" data-i18n="studyos.navFocus">Focus</a><a href="analytics.html" data-i18n="studyos.navAnalytics">Analytics</a><a href="doubt.html" data-i18n="studyos.navDoubt">Doubt</a><a href="profile.html" data-i18n="studyos.navProfile">Profile</a>
      <button class="theme-btn">🌙</button>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <button class="theme-btn">🌙</button><button class="menu-btn">☰</button>
    </div>
    <div class="mobile-menu" style="width:100%">
      <a href="index.html" data-i18n="studyos.navHome">Home</a><a href="dashboard.html" data-i18n="studyos.navDashboard">Dashboard</a><a href="planner.html" data-i18n="studyos.navPlanner">Planner</a>
      <a href="focus.html" data-i18n="studyos.navFocus">Focus</a><a href="analytics.html" data-i18n="studyos.navAnalytics">Analytics</a><a href="doubt.html" data-i18n="studyos.navDoubt">Doubt</a><a href="profile.html" data-i18n="studyos.navProfile">Profile</a>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Profile Setup</h1>
    <p class="page-subtitle">Configure your study preferences. Data is saved in your browser.</p>

    <div style="max-width:640px;margin:0 auto">
      <div class="glass">
        <div id="alert" class="alert alert-success hidden"></div>

        <div class="grid-2">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="input" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="grade">Class / Grade</label>
            <input type="text" id="grade" class="input" placeholder="e.g. Class 12">
          </div>
        </div>

        <div class="form-group">
          <label>Subjects</label>
          <div class="pills" id="subjects"></div>
        </div>
        <div class="form-group">
          <label>Strengths</label>
          <div class="pills green" id="strengths"></div>
        </div>
        <div class="form-group">
          <label>Weaknesses</label>
          <div class="pills red" id="weaknesses"></div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="exam-date">Upcoming Exam Date</label>
            <input type="date" id="exam-date" class="input">
          </div>
          <div class="form-group">
            <label for="daily-hours">Daily Study Hours: <span id="hours-val">3</span>h</label>
            <input type="range" id="daily-hours" min="1" max="8" value="3">
          </div>
        </div>



        <div class="form-group">
          <label for="openrouter-key">OpenRouter API Key <span style="opacity:.65;font-weight:400">(optional — enables full AI; stored only in this browser)</span></label>
          <div style="display:flex;gap:8px;">
            <input type="password" id="openrouter-key" class="input" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false" style="flex:1;min-width:0;font-family:ui-monospace,monospace;">
            <button type="button" id="toggle-key" class="btn btn-secondary" aria-label="Show or hide API key">👁</button>
          </div>
          <div id="key-status" style="font-size:12px;margin-top:6px;opacity:.75;"></div>
          <div style="font-size:12px;margin-top:4px;opacity:.75;">Get a free key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. Leave blank to use demo answers.</div>
        </div>

        <button id="save-btn" class="btn btn-primary btn-block">Save Profile</button>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/lang-switcher.js"></script>
</body>
</html>
